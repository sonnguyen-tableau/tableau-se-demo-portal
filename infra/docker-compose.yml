version: "3.9"

# Local development sidecars. The web app runs separately via `pnpm dev`
# and reaches these services over the host network on the published ports.
#
# Required env (in repo-root .env, gitignored):
#   TABLEAU_SITE_URL=https://<pod>.online.tableau.com
#   TABLEAU_SITE_NAME=<contentUrl>
#   TABLEAU_PAT_NAME=<service-account-pat-name>
#   TABLEAU_PAT_SECRET=<service-account-pat-secret>
#
# Bring up:  docker compose -f infra/docker-compose.yml up -d

services:
  tableau-mcp:
    # Official Tableau MCP server distributed on npm as @tableau/mcp-server.
    # We run it in HTTP transport mode on port 8081 so the portal's chat
    # route can connect via streamable HTTP.
    image: node:22.13-alpine
    container_name: tableau-mcp
    working_dir: /srv
    command: >
      sh -c "npm i -g @tableau/mcp-server &&
             tableau-mcp --transport http --port 8081 --host 0.0.0.0"
    environment:
      TABLEAU_SITE_URL: ${TABLEAU_SITE_URL:?required}
      TABLEAU_SITE_NAME: ${TABLEAU_SITE_NAME:?required}
      TABLEAU_PAT_NAME: ${TABLEAU_PAT_NAME:?required}
      TABLEAU_PAT_SECRET: ${TABLEAU_PAT_SECRET:?required}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3

