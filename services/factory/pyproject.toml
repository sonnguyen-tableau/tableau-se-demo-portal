[project]
name = "factory"
version = "0.1.0"
description = "Tableau AI Portal — Demo Factory pipeline (scrape → profile → generate → publish)."
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "httpx>=0.28",
  "structlog>=24.4",
  "anthropic>=0.42",
  "faker>=33.1",
  "numpy>=2.2",
  "pandas>=2.2",
  "tableauserverclient>=0.32",
  "tableauhyperapi>=0.0.20300",
]

[project.optional-dependencies]
playwright = ["playwright>=1.49"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "mypy>=1.13",
  "ruff>=0.8",
  "httpx>=0.28",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["app/templates"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_decorators = false
files = ["app", "tests"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["tableauserverclient.*", "tableauhyperapi.*", "faker.*", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["-q", "--strict-markers"]
